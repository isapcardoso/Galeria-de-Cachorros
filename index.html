<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Cachorros</title>

    <style>
        body {
            background-color: rgba(255, 162, 235, 0.741);
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            padding: 20px;
        }

        h1 {
            font-size: 40px;
            color: rgb(255, 83, 186);
            border: 2px dashed rgb(250, 182, 241);
            background-color: rgb(249, 250, 215);
            margin: 0 auto 30px auto;
            padding: 15px;
            width: 80%;
            box-shadow: 4px 5px 10px gray;
            border-radius: 15px;
        }

        select, input {
            color: palevioletred;
            background-color: bisque;
            border: 2px dashed rgb(255, 83, 186);
            border-radius: 12px;
            height: 50px;
            padding: 10px;
            font-size: medium;
            font-family: 'Times New Roman', Times, serif;
            margin: 5px;
            box-shadow: 2px 3px 6px gray;
        }

        input {
            width: 60px;
            text-align: center;
        }

        button {
            color: palevioletred;
            background-color: bisque;
            border: 2px dashed rgb(255, 83, 186);
            border-radius: 12px;
            height: 50px;
            width: 200px;
            font-size: medium;
            font-family: 'Times New Roman', Times, serif;
            margin: 5px;
            box-shadow: 2px 3px 6px gray;
        }

        button:hover {
            background-color: rgb(249, 250, 215);
        }

        #mensagem {
            font-size: 20px;
            color: rgb(180, 20, 110);
            margin: 20px;
        }

        #galeria img {
            width: 300px;
            height: 280px;
            margin: 15px;
            border: 3px dashed rgb(249, 255, 77);
            background-color: bisque;
            border-radius: 15px;
            box-shadow: 4px 5px 10px gray;
        }
    </style>
</head>
<body>
    <h1>🐾 Galeria de Cachorros 🐕</h1>

    <label for="racas">
        <select id="racas">
            <option value="">Selecione uma raça</option>
        </select>
    </label>

    <label for="quantidade">
        <input type="number" id="quantidade" min="1" max="10" value="3">
    </label>

    <button id="aleatorios">Mostrar aleatórios</button>
    <button id="porRaca">Mostrar 3 da raça</button>

    <p id="mensagem"></p>

    <div id="galeria"></div>
    
    <script src="script.js"></script>
</body>
</html>
